[package]
name = "idlci"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local CI for idl projects in a pull workspace: job queue, web UI, MCP server"
repository = "https://github.com/jbisfun/idlci"

[dependencies]
anyhow = "1"
async-stream = "0.3.6"
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures-core = "0.3"
git2 = { version = "0.21.0", default-features = false }
minijinja = { version = "3.1.0", features = ["serde", "loop_controls", "urlencode", "json"] }
nix = { version = "0.32.0", features = ["signal", "process", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
rmcp = { version = "3.10.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std", "process", "time", "fs", "net", "signal", "sync"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3"
